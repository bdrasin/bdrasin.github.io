<!--
  Minimal host-page demo listener for the ProductChoiceList Lightning Type.

  This is the "parent page" side of the two-way communication demo. It does
  NOT go in the Lightning Type bundle — it represents the arbitrary web page
  (or experience site) that embeds the enhanced chat iframe via bootstrap.js
  (V1) or init.js (V2).

  Not wired up yet: sending the clicked productId back into the conversation
  via sendMessage()/setSessionContext(). That's the next step once this
  half of the loop (agent -> host page) is confirmed working.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ProductChoiceList host page listener demo</title>
  </head>
  <body>
    <h1>Products from chat</h1>
    <div id="product-container"></div>

    <script>
      // Must match HOST_PAGE_EVENT_NAME in productChoiceListRenderer.js
      const HOST_PAGE_EVENT_NAME = "productChoicesAvailable";

      window.addEventListener(HOST_PAGE_EVENT_NAME, (event) => {
        console.log(`Received the ${HOST_PAGE_EVENT_NAME} event...`);
        console.log("Event detail: ", event.detail); // { products: [{ productId, imageUrl }, ...] }

        const { products = [] } = event.detail ?? {};
        const container = document.getElementById("product-container");
        container.innerHTML = "";

        products.forEach(({ productId, imageUrl }) => {
          const img = document.createElement("img");
          // The Salesforce SSE layer redacts URLs in action output, so
          // imageUrl arrives here as the literal string "URL_Redacted"
          // instead of the real picsum URL. productId still comes through
          // correctly, so rebuild the image URL from it instead of trusting
          // the (redacted) imageUrl field.
          img.src = `https://picsum.photos/seed/${productId}/400/300`;
          img.alt = productId;
          img.style.cursor = "pointer";
          img.style.maxWidth = "120px";
          img.style.margin = "4px";

          // Placeholder for the next step of the demo: clicking a product
          // should call back into the embedded chat client's public API
          // (sendMessage() and/or setSessionContext()) with productId.
          img.addEventListener("click", () => {
            console.log(`Clicked product ${productId} (not yet wired to sendMessage/setSessionContext)`);
          });

          container.appendChild(img);
        });
      });

      function initEmbeddedMessaging() {
    		try {
    			embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'
    
    			embeddedservice_bootstrap.init(
    				'00DSB00001CAu6L',
    				'ASA_1',
    				'https://orgfarm-8c60cc881b.test1.my.pc-rnd.site.com/ESWASA11788317609894',
    				{
    					scrt2URL: 'https://orgfarm-8c60cc881b.test1.my.pc-rnd.salesforce-scrt.com'
    				}
    			);
    		} catch (err) {
    			console.error('Error loading Embedded Messaging: ', err);
    		}
    	};
      
    </script>
    <script type='text/javascript' src='https://orgfarm-8c60cc881b.test1.my.pc-rnd.site.com/ESWASA11788317609894/assets/js/bootstrap.js' onload='initEmbeddedMessaging()'></script>
  </body>
</html>
